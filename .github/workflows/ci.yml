name: CI — Build & Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-unit:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript (strict)
        run: bun run build

      - name: Typecheck tests (strict)
        run: bun run test:typecheck

      - name: Run unit tests
        run: bun run test:unit

  integration-and-concurrency:
    name: Integration & Concurrency Tests (PostgreSQL 15)
    needs: build-and-unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jungle_user
          POSTGRES_PASSWORD: jungle_password
          POSTGRES_DB: jungle_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U jungle_user -d jungle_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5434"
      DB_USER: jungle_user
      DB_PASSWORD: jungle_password
      DB_NAME: jungle_test_db
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration

      - name: Run concurrency tests
        run: bun run test:concurrency

services:
  db-test:
    image: postgres:15-alpine
    container_name: backend-challenge-db-test
    environment:
      POSTGRES_USER: jungle_user
      POSTGRES_PASSWORD: jungle_password
      POSTGRES_DB: jungle_test_db
    ports:
      - "5434:5432"          
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jungle_user"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    restart: unless-stopped

  localstack-test:
    image: localstack/localstack:3.8.0
    container_name: backend-challenge-localstack-test
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4567:4566" # Alterado para 4567 para não conflitar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - localstack-data-test:/tmp/localstack
      - ./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    restart: unless-stopped

volumes:
  pgdata-test:
  localstack-data-test:
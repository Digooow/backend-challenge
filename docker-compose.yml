services:
  postgres:
    image: postgres:15-alpine
    container_name: jungle_postgres
    environment:
      POSTGRES_USER: jungle_user
      POSTGRES_PASSWORD: jungle_password
      POSTGRES_DB: jungle_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle_user -d jungle_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8.0
    container_name: jungle_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

  api-1:
    build: .
    container_name: jungle_api_1
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: api-1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: jungle_user
      DB_PASSWORD: jungle_password
      DB_NAME: jungle_db
      DB_POOL_MIN: 2
      DB_POOL_MAX: 20
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    build: .
    container_name: jungle_api_2
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: api-2
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: jungle_user
      DB_PASSWORD: jungle_password
      DB_NAME: jungle_db
      DB_POOL_MIN: 2
      DB_POOL_MAX: 20
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  api-3:
    build: .
    container_name: jungle_api_3
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: api-3
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: jungle_user
      DB_PASSWORD: jungle_password
      DB_NAME: jungle_db
      DB_POOL_MIN: 2
      DB_POOL_MAX: 20
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: jungle_nginx_lb
    ports:
      - "3000:3000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped
